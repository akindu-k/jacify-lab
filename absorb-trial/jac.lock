# Written by neojac: what each ecosystem's own resolver pinned for jac.toml.
# `neojac install --frozen` installs exactly this.
version = 1

[npm.server]
name = "json-server"
version = "1.0.0-beta.15"
lockfileVersion = 3
requires = true

[npm.server.packages.""]
name = "json-server"
version = "1.0.0-beta.15"
license = "MIT"

[npm.server.packages."".dependencies]
